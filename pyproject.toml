[project]
name = "gns-pytorch"
version = "0.2.0"
description = "Simple Gradient Noise Scale (GNS) calculation for PyTorch"
readme = "README.md"
authors = [{ name = "elyx", email = "elio@pascarelli.com" }]
requires-python = ">=3.9"
dependencies = ["torch>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3.5"]
